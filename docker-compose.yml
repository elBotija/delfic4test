services:
  mariadb:
    image: mariadb:10.11
    container_name: colegio_mariadb_legacy
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: colegio_legacy
      MYSQL_USER: colegio_user
      MYSQL_PASSWORD: colegio_pass
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  legacy_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: colegio_app_legacy
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: colegio_legacy
      DB_USER: colegio_user
      DB_PASS: colegio_pass
    volumes:
      - ./src:/app/src
    ports:
      - "8080:8080" # noVNC Web UI: acceda desde http://localhost:8080
      - "5901:5900" # VNC Nativo opcional (puerto 5901 para no colisionar con Screen Sharing de macOS)

volumes:
  mariadb_data:
